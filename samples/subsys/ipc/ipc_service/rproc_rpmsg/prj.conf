CONFIG_IPC_SERVICE=y
CONFIG_REMOTEPROC=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
# Holds the log burst of the 100 client sample messages.
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RPMSG=y
# Wait for a free RPMsg buffer instead of dropping shell output.
CONFIG_SHELL_BACKEND_RPMSG_FORCE_TX_BLOCKING_MODE=y
